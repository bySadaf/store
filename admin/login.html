<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="../css/variables.css?v=6" rel="stylesheet">
  <link href="css/admin.css?v=6" rel="stylesheet">
</head>
<body data-page="login" data-page-title="Admin Login">

  <main class="login-page">
    <div class="login-card">
      <span class="login-badge"><i class="bi bi-shop" aria-hidden="true"></i></span>
      <h1>Admin Login</h1>
      <p class="login-sub">Sign in to manage your store.</p>

      <div id="loginConfigBanner" class="d-none mb-3" aria-live="polite"></div>
      <div id="loginError" class="alert alert-danger d-none py-2" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email</label>
          <input type="email" class="form-control" id="loginEmail" name="email"
                 placeholder="admin@example.com" autocomplete="username" required>
        </div>

        <div class="mb-4">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-wrap">
            <input type="password" class="form-control" id="loginPassword" name="password"
                   placeholder="Your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-app w-100 py-2" id="loginSubmit">
          <i class="bi bi-box-arrow-in-right me-2" aria-hidden="true"></i>Sign In
        </button>
      </form>

      <p class="login-footer">
        <a href="../index.html">&larr; Back to the website</a>
      </p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js?v=6"></script>
  <script src="../js/supabase.js?v=6"></script>
  <script src="../js/utils.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
</body>
</html>
