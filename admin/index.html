<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | Store Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="../css/variables.css?v=6" rel="stylesheet">
  <link href="css/admin.css?v=6" rel="stylesheet">
</head>
<body data-page="dashboard" data-page-title="Dashboard">

  <div id="adminShell">
    <div id="bootOverlay" class="admin-boot">
      <div class="spinner-border" role="status"></div>
      <p>Checking your login&hellip;</p>
    </div>

    <main class="admin-main d-none" id="adminContent">
      <div class="page-head">
        <div>
          <h1 id="dashWelcome">Welcome back</h1>
          <p class="sub">Here is a quick look at your store.</p>
        </div>
      </div>

      <!-- Statistics -->
      <div class="row g-3 mb-2">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <span class="stat-icon si-teal"><i class="bi bi-box-seam" aria-hidden="true"></i></span>
            <div>
              <h2 id="statTotalProducts">&mdash;</h2>
              <p class="stat-label">Total products</p>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <span class="stat-icon si-blue"><i class="bi bi-eye" aria-hidden="true"></i></span>
            <div>
              <h2 id="statActiveProducts">&mdash;</h2>
              <p class="stat-label">Active products</p>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <span class="stat-icon si-purple"><i class="bi bi-tags" aria-hidden="true"></i></span>
            <div>
              <h2 id="statCategories">&mdash;</h2>
              <p class="stat-label">Categories</p>
            </div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <span class="stat-icon si-amber"><i class="bi bi-star-fill" aria-hidden="true"></i></span>
            <div>
              <h2 id="statFeatured">&mdash;</h2>
              <p class="stat-label">Featured products</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick actions (for the non-technical owner) -->
      <div class="quick-actions">
        <a class="btn btn-primary-app" href="products.html?add=1"><i class="bi bi-plus-lg me-2"></i>Add Product</a>
        <a class="btn btn-outline-app" href="categories.html?add=1"><i class="bi bi-plus-lg me-2"></i>Add Category</a>
        <a class="btn btn-outline-app" href="settings.html"><i class="bi bi-gear me-2"></i>Settings</a>
      </div>

      <!-- Recent products -->
      <div class="panel">
        <div class="panel-head">
          <h2>Recently added products</h2>
          <a class="btn btn-outline-app btn-sm" href="products.html">Manage products &rarr;</a>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th scope="col">Image</th>
                <th scope="col">Product</th>
                <th scope="col">Category</th>
                <th scope="col">Price</th>
                <th scope="col">Status</th>
              </tr>
            </thead>
            <tbody id="recentTableBody">
              <tr><td colspan="5" class="table-loading"><div class="spinner-border text-primary" role="status"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js?v=6"></script>
  <script src="../js/supabase.js?v=6"></script>
  <script src="../js/utils.js?v=6"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/dashboard.js?v=6"></script>
</body>
</html>
